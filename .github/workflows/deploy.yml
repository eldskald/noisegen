name: Deploy

on:
  push:
    tags:
      - 'v*'

env:
  ITCH_USERNAME: eldskald 
  ITCH_APP_ID: noisegen

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 16
          platform: x64

      - name: Install MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Install emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: 'emsdk-cache'

      - name: Install raylib dependencies
        run: sudo apt install libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Install raylib
        run: bin/install-dependencies

      - name: Build for linux
        run: make linux

      - name: Build for windows
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace fedora:latest bash -c "
            dnf install -y mingw64-gcc make zip findutils &&
            make windows
          "

      - name: Build for WebGL
        run: make webgl

      - name: Deploy web
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ./webgl.zip
          itchUsername: ${{ env.ITCH_USERNAME }}
          itchGameId: ${{ env.ITCH_APP_ID }}
          buildChannel: webgl 
          buildNumber: ${{ github.ref_name }}

      - name: Deploy linux
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ./linux.zip
          itchUsername: ${{ env.ITCH_USERNAME }}
          itchGameId: ${{ env.ITCH_APP_ID }}
          buildChannel: linux 
          buildNumber: ${{ github.ref_name }}

      - name: Deploy windows
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ./windows.zip
          itchUsername: ${{ env.ITCH_USERNAME }}
          itchGameId: ${{ env.ITCH_APP_ID }}
          buildChannel: windows 
          buildNumber: ${{ github.ref_name }}
